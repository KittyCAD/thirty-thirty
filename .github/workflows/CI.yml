on:
    workflow_dispatch:
    pull_request:
permissions: read-all
name: Rust CI
jobs:
    check-lint:
      name: Check lints
      runs-on: ubuntu-latest-8-cores
      steps:
        - uses: actions/checkout@v4
        - uses: taiki-e/install-action@just
        - name: Install Rust
          uses: dtolnay/rust-toolchain@stable
          with:
            components: clippy

        - name: Check lints
          run: just lint

    cargo-fmt:
        name: Check formatting
        runs-on: ubuntu-latest-8-cores
        steps:
          - uses: actions/checkout@v4
          - uses: taiki-e/install-action@just
          - name: Install Rust
            uses: dtolnay/rust-toolchain@stable
            with:
                components: rustfmt
          - uses: cargo-bins/cargo-binstall@main
          - name: Install deps
            run: cargo binstall cargo-sort typos-cli
          - name: Run checks
            run: just fmt-check

